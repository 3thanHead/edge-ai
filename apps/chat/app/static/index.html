<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cluster chat</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #232323;
      --border: #353535;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #d97757;
      --user-bubble: #2d2d2d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    header .spacer { flex: 1; }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 14px;
      outline: none;
    }
    #status { font-size: 12px; color: var(--muted); }
    #status.live::before { content: "● "; color: #4caf50; }
    #status.off::before  { content: "● "; color: #e05252; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
    }
    .row { max-width: 760px; margin: 0 auto; padding: 6px 18px; }
    .msg { display: flex; gap: 12px; padding: 10px 0; }
    .avatar {
      flex: 0 0 26px; height: 26px; width: 26px; border-radius: 6px;
      display: grid; place-items: center; font-size: 13px; font-weight: 700;
    }
    .user .avatar { background: #3a3a3a; }
    .bot .avatar  { background: var(--accent); color: #1a1a1a; }
    .bubble { white-space: pre-wrap; word-wrap: break-word; padding-top: 2px; }
    .user .bubble { color: var(--text); }
    .bot .bubble  { color: var(--text); }
    .bot .bubble .cursor {
      display: inline-block; width: 7px; height: 15px;
      background: var(--accent); margin-left: 1px; vertical-align: text-bottom;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    .error { color: #e98080; font-size: 13px; }

    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 14px 18px;
    }
    .composer {
      max-width: 760px; margin: 0 auto;
      display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
      flex: 1; resize: none; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; font: inherit; outline: none; max-height: 200px;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent); color: #1a1a1a; border: none;
      border-radius: 10px; padding: 11px 16px; font-weight: 600;
      cursor: pointer; font-size: 14px;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.stop { background: #b54a3a; color: #fff; }
    .stopped { color: var(--muted); font-size: 12px; font-style: italic; }
    .node-badge { display: none; font-size: 11px; color: var(--muted); margin-bottom: 5px; letter-spacing: .02em; }
    .node-badge.on { display: block; }
    .node-badge.on::before { content: "● "; color: #4caf50; }
    .hint { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 11px; }

    /* -- agent activity feed (Claude-Code-ish, minimal) -- */
    .activity {
      border-left: 2px solid var(--border);
      margin: 4px 0 8px;
      padding: 2px 0 2px 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .activity .step { padding: 2px 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
    .activity .step .spin {
      display: inline-block; margin-right: 6px; color: var(--accent);
      animation: rotate 1s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .activity .step.done::before { content: "✓ "; color: #4caf50; }
    .activity .step.fail::before { content: "✗ "; color: #e05252; }
    .activity .step.think { font-style: italic; }
    .answer-chip {
      display: inline-block; font-size: 11px; font-weight: 700;
      border-radius: 6px; padding: 1px 8px; margin-right: 8px;
      vertical-align: 1px; letter-spacing: .03em;
    }
    .answer-chip.yes { background: #16391f; color: #7ddb8f; }   /* green LED */
    .answer-chip.no  { background: #4a1f1a; color: #ff9d8a; }   /* red LED */

    /* -- live mic feed (ESP32 -> agents hub -> /ws/audio) -- */
    #micBtn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 500;
    }
    #micBtn.on { color: var(--accent); border-color: var(--accent); }
    #audioPanel {
      display: none; border-bottom: 1px solid var(--border);
      background: var(--panel); padding: 10px 18px 8px;
    }
    #audioPanel.open { display: block; }
    #scope {
      display: block; width: 100%; height: 90px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    .audio-row { display: flex; align-items: center; gap: 12px; margin-top: 7px; }
    .meter {
      flex: 1; height: 6px; border-radius: 3px; overflow: hidden;
      background: var(--bg); border: 1px solid var(--border);
    }
    #meterFill { height: 100%; width: 0%; background: #4caf50; }
    #audioStats {
      font-size: 11px; color: var(--muted); white-space: nowrap;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    #transcripts { margin-top: 6px; max-height: 96px; overflow-y: auto; }
    #transcripts:empty { display: none; }
    .transcript {
      font-size: 13px; color: var(--text); padding: 2px 0;
      cursor: pointer; opacity: 0.9;
    }
    .transcript:hover { color: var(--accent); }
    .transcript .t-time { color: var(--muted); font-size: 11px; margin-right: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .transcript.stt-note { color: var(--muted); font-style: italic; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>cluster chat</h1>
    <select id="model" title="Model"></select>
    <select id="node" title="Node" style="display:none"></select>
    <select id="agent" title="Agent" style="display:none"></select>
    <button id="micBtn" title="Live mic feed from the ESP32">🎙 mic</button>
    <div class="spacer"></div>
    <span id="status" class="off">connecting…</span>
  </header>

  <div id="audioPanel">
    <canvas id="scope"></canvas>
    <div class="audio-row">
      <div class="meter"><div id="meterFill"></div></div>
      <span id="audioStats">connecting…</span>
    </div>
    <div id="transcripts" title="Click a line to put it in the composer"></div>
  </div>

  <div id="messages"></div>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message the cluster…" autofocus></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for newline · Esc to stop</div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const messagesEl = $("messages");
    const modelEl = $("model");
    const nodeEl = $("node");
    const agentEl = $("agent");
    const inputEl = $("input");
    const sendEl = $("send");
    const statusEl = $("status");

    const history = [];   // {role, content} sent to the model
    let ws = null;
    let streaming = false;

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "row";
      const msg = document.createElement("div");
      msg.className = "msg " + (role === "user" ? "user" : "bot");
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "U" : "AI";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "bot") {
        // badge (which node served) + text are separate children so per-token text
        // updates don't wipe the badge; the cursor is appended after, by send().
        const badge = document.createElement("span");
        badge.className = "node-badge";
        const textEl = document.createElement("span");
        textEl.className = "text";
        textEl.textContent = text;
        bubble.append(badge, textEl);
      } else {
        bubble.textContent = text;
      }
      msg.append(avatar, bubble);
      row.append(msg);
      messagesEl.append(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    // ----- model list -----
    async function loadModels() {
      try {
        const res = await fetch("/api/models");
        const data = await res.json();
        modelEl.innerHTML = "";
        for (const name of data.models) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          modelEl.append(opt);
        }
        if (!data.models.length) {
          modelEl.innerHTML = "<option>(no models on cluster)</option>";
        }
      } catch (e) {
        modelEl.innerHTML = "<option>(failed to load models)</option>";
      }
    }

    // ----- node list (pin a chat to one node, or Auto = load-balanced) -----
    async function loadNodes() {
      try {
        const res = await fetch("/api/nodes");
        const { nodes } = await res.json();
        nodeEl.innerHTML = '<option value="">Auto (load-balanced)</option>';
        for (const name of nodes) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          nodeEl.append(opt);
        }
        // Hide the picker entirely on a standalone/dev run with no per-node info.
        nodeEl.style.display = nodes.length ? "" : "none";
      } catch (e) {
        nodeEl.style.display = "none";
      }
    }

    // ----- agent list (route a message to an agents-app agent, or plain chat) -----
    async function loadAgents() {
      try {
        const res = await fetch("/api/agents");
        const { agents } = await res.json();
        agentEl.innerHTML = '<option value="">Chat (no agent)</option>';
        for (const a of agents) {
          const opt = document.createElement("option");
          opt.value = a.name;
          opt.textContent = "agent: " + a.name;
          opt.title = a.description || "";
          agentEl.append(opt);
        }
        agentEl.style.display = agents.length ? "" : "none";
      } catch (e) {
        agentEl.style.display = "none";
      }
    }

    // ----- agent activity feed -----
    let activityEl = null;   // the working-steps list inside the active bubble
    let workingStep = null;  // the step line currently spinning

    function activityStep(text, cls) {
      if (!activityEl) {
        activityEl = document.createElement("div");
        activityEl.className = "activity";
        activeBubble.insertBefore(activityEl, activeBubble.querySelector(".text"));
      }
      const step = document.createElement("div");
      step.className = "step" + (cls ? " " + cls : "");
      step.textContent = text;
      activityEl.append(step);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return step;
    }

    function onAgentEvent(ev) {
      if (ev.type === "start") {
        workingStep = activityStep("");
        const s = document.createElement("span");
        s.className = "spin"; s.textContent = "◐";
        workingStep.append(s, document.createTextNode(`agent ${ev.agent} is working…`));
      } else if (ev.type === "thinking") {
        activityStep(ev.text, "think");
      } else if (ev.type === "tool_call") {
        activityStep(`${ev.tool}(${JSON.stringify(ev.args)})`);
      } else if (ev.type === "tool_result") {
        const ok = !(ev.result && ev.result.error);
        const last = activityEl && activityEl.lastElementChild;
        if (last && !last.classList.contains("done") && !last.classList.contains("fail")
            && !last.querySelector(".spin")) {
          last.classList.add(ok ? "done" : "fail");
          if (!ok) last.textContent += " — " + ev.result.error;
        }
      } else if (ev.type === "final") {
        if (workingStep) { workingStep.remove(); workingStep = null; }
        const out = ev.output || {};
        const textEl = activeBubble.querySelector(".text");
        if (out.answer === "yes" || out.answer === "no") {
          const chip = document.createElement("span");
          chip.className = "answer-chip " + out.answer;
          chip.textContent = out.answer.toUpperCase();
          activeBubble.insertBefore(chip, textEl);
        }
        activeText = out.message || out.reasoning ||
                     (out.emotion ? `face set to ${out.emotion}` : JSON.stringify(out));
        textEl.textContent = activeText;
        if (out.reasoning && out.message) {
          activityStep(out.reasoning, "think");
        }
      } else if (ev.type === "error") {
        if (workingStep) { workingStep.remove(); workingStep = null; }
        activityStep(ev.message, "fail");
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ----- websocket -----
    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
      ws.onopen = () => setStatus("connected", "live");
      ws.onclose = () => { setStatus("disconnected", "off"); setTimeout(connect, 1500); };
      ws.onerror = () => setStatus("error", "off");
      ws.onmessage = onMessage;
    }

    let activeBubble = null;
    let activeText = "";

    function onMessage(ev) {
      const data = JSON.parse(ev.data);
      if (data.type === "agent") {
        onAgentEvent(data.event);
      } else if (data.type === "node") {
        const badge = activeBubble && activeBubble.querySelector(".node-badge");
        if (badge) { badge.textContent = data.name; badge.classList.add("on"); }
      } else if (data.type === "token") {
        activeText += data.content;
        activeBubble.querySelector(".text").textContent = activeText;  // cursor (sibling) stays last
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (data.type === "done") {
        finishStreaming();
        history.push({ role: "assistant", content: activeText });
      } else if (data.type === "cancelled") {
        // keep the partial output (so the conversation can continue from it) + mark it
        if (activeText) history.push({ role: "assistant", content: activeText });
        if (activeBubble) {
          const note = document.createElement("span");
          note.className = "stopped";
          note.textContent = activeText ? "  ⊘ stopped" : "⊘ stopped";
          activeBubble.append(note);
        }
        finishStreaming();
      } else if (data.type === "error") {
        activeBubble.innerHTML = "";
        const err = document.createElement("span");
        err.className = "error";
        err.textContent = "⚠ " + data.message;
        activeBubble.append(err);
        finishStreaming();
      }
    }

    function cursor() {
      const c = document.createElement("span");
      c.className = "cursor";
      return c;
    }

    function setStreaming(on) {
      streaming = on;
      sendEl.textContent = on ? "Stop" : "Send";
      sendEl.classList.toggle("stop", on);  // Stop must stay clickable, so never disable
    }

    function finishStreaming() {
      const c = activeBubble && activeBubble.querySelector(".cursor");
      if (c) c.remove();
      if (workingStep) { workingStep.remove(); workingStep = null; }
      activeBubble = null;
      activityEl = null;
      setStreaming(false);
    }

    // ----- sending / stopping -----
    function send() {
      const text = inputEl.value.trim();
      if (!text || streaming || !ws || ws.readyState !== WebSocket.OPEN) return;
      const model = modelEl.value;

      addMessage("user", text);
      history.push({ role: "user", content: text });
      inputEl.value = "";
      autoGrow();

      activeText = "";
      activeBubble = addMessage("bot", "");
      activeBubble.append(cursor());

      setStreaming(true);
      ws.send(JSON.stringify({ model, node: nodeEl.value,
                               agent: agentEl.value || undefined, messages: history }));
    }

    function stop() {
      if (!streaming || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "cancel" }));  // UI finalizes on the server's "cancelled"
    }

    // ----- live mic feed (16 kHz mono int16 PCM from the device, via /ws/audio) -----
    const SR = 16000;
    const micBtn = $("micBtn");
    const audioPanel = $("audioPanel");
    const scope = $("scope");
    const meterFill = $("meterFill");
    const audioStats = $("audioStats");

    const ring = new Int16Array(SR * 3);   // 3 s rolling window
    let ringPos = 0, ringFilled = 0;
    let audioWs = null, rafId = null, feedOpen = false, feedNote = "";
    let lastFrameAt = 0, rateBytes = 0, rateAt = 0, kbps = 0;

    function sizeScope() {
      const dpr = window.devicePixelRatio || 1;
      scope.width = Math.floor(scope.clientWidth * dpr);
      scope.height = Math.floor(scope.clientHeight * dpr);
    }
    window.addEventListener("resize", () => { if (feedOpen) sizeScope(); });

    function connectFeed() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      audioWs = new WebSocket(`${proto}://${location.host}/ws/audio`);
      audioWs.binaryType = "arraybuffer";
      audioWs.onopen = () => { feedNote = ""; };
      audioWs.onmessage = (ev) => {
        if (ev.data.byteLength & 1) return;             // not int16-aligned
        const samples = new Int16Array(ev.data);
        for (let i = 0; i < samples.length; i++) {
          ring[ringPos] = samples[i];
          ringPos = (ringPos + 1) % ring.length;
        }
        ringFilled = Math.min(ringFilled + samples.length, ring.length);
        lastFrameAt = performance.now();
        rateBytes += ev.data.byteLength;
      };
      audioWs.onclose = (ev) => {
        audioWs = null;
        if (!feedOpen) return;
        feedNote = ev.reason || "feed disconnected — retrying";
        setTimeout(() => { if (feedOpen && !audioWs) connectFeed(); }, 2000);
      };
    }

    function drawFeed(now) {
      if (!feedOpen) return;
      rafId = requestAnimationFrame(drawFeed);

      const ctx = scope.getContext("2d");
      const W = scope.width, H = scope.height, mid = H / 2;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = "#353535";
      ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();

      // Scrolling min/max waveform: each column condenses its slice of the
      // ring, oldest samples on the left, newest at the right edge.
      const N = ring.length;
      ctx.strokeStyle = "#d97757";
      ctx.beginPath();
      for (let x = 0; x < W; x++) {
        const from = Math.floor(x * N / W), to = Math.floor((x + 1) * N / W);
        let lo = 32767, hi = -32768;
        for (let i = from; i < to; i++) {
          const s = ring[(ringPos + i) % N];
          if (s < lo) lo = s;
          if (s > hi) hi = s;
        }
        ctx.moveTo(x + 0.5, mid - (hi / 32768) * mid);
        ctx.lineTo(x + 0.5, mid - (lo / 32768) * mid + 1);
      }
      ctx.stroke();

      // Level meter: RMS over the newest 200 ms, mapped -60..0 dBFS.
      let sum = 0;
      const span = Math.min(SR * 0.2, ringFilled) | 0;
      for (let i = 0; i < span; i++) {
        const s = ring[(ringPos - 1 - i + N) % N];
        sum += s * s;
      }
      const rms = span ? Math.sqrt(sum / span) / 32768 : 0;
      const db = rms > 0 ? 20 * Math.log10(rms) : -100;
      const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));
      meterFill.style.width = pct + "%";
      meterFill.style.background = pct > 85 ? "#e05252" : pct > 60 ? "#d9a557" : "#4caf50";

      if (now - rateAt > 1000) {
        kbps = rateBytes / ((now - rateAt) / 1000) / 1024;
        rateBytes = 0; rateAt = now;
      }
      const live = lastFrameAt && now - lastFrameAt < 2000;
      audioStats.textContent = feedNote ? "⚠ " + feedNote
        : live ? `● live · 16 kHz mono · ${kbps.toFixed(1)} kB/s · ${db.toFixed(0)} dBFS`
        : "waiting for device… (is the ESP32's mic streaming?)";
      audioStats.style.color = live && !feedNote ? "#4caf50" : "";
    }

    // ----- live speech-to-text captions (agents STT via /ws/transcripts) -----
    const transcriptsEl = $("transcripts");
    let sttWs = null;
    let lastSttTs = 0;   // dedupe: reconnect replays recent history

    function addTranscript(ev) {
      if (ev.type === "stt_state") {
        transcriptsEl.innerHTML = "";
        if (ev.state !== "listening") {
          const note = document.createElement("div");
          note.className = "transcript stt-note";
          note.textContent = ev.state === "loading"
            ? "speech-to-text: loading model…"
            : "speech-to-text: off (agents app has no STT)";
          transcriptsEl.append(note);
        }
        return;
      }
      if (ev.ts && ev.ts <= lastSttTs) return;  // already shown (or a dup)
      lastSttTs = ev.ts || lastSttTs;
      const note = transcriptsEl.querySelector(".stt-note");
      if (note) note.remove();
      const line = document.createElement("div");
      line.className = "transcript";
      const t = new Date((ev.ts || 0) * 1000);
      const hh = String(t.getHours()).padStart(2, "0");
      const mm = String(t.getMinutes()).padStart(2, "0");
      const ss = String(t.getSeconds()).padStart(2, "0");
      line.innerHTML = `<span class="t-time">${hh}:${mm}:${ss}</span>`;
      line.append(document.createTextNode(ev.text));
      line.addEventListener("click", () => {   // caption -> composer
        inputEl.value = ev.text;
        autoGrow();
        inputEl.focus();
      });
      transcriptsEl.append(line);
      while (transcriptsEl.children.length > 8) transcriptsEl.firstChild.remove();
      transcriptsEl.scrollTop = transcriptsEl.scrollHeight;
    }

    function connectTranscripts() {
      if (sttWs) return;  // never run two live transcript sockets
      const proto = location.protocol === "https:" ? "wss" : "ws";
      sttWs = new WebSocket(`${proto}://${location.host}/ws/transcripts`);
      sttWs.onmessage = (ev) => addTranscript(JSON.parse(ev.data));
      sttWs.onclose = () => {
        sttWs = null;
        if (feedOpen) setTimeout(() => { if (feedOpen && !sttWs) connectTranscripts(); }, 3000);
      };
    }

    function toggleFeed() {
      feedOpen = !feedOpen;
      audioPanel.classList.toggle("open", feedOpen);
      micBtn.classList.toggle("on", feedOpen);
      if (feedOpen) {
        sizeScope();
        ring.fill(0); ringFilled = 0; lastFrameAt = 0;
        rateBytes = 0; rateAt = performance.now(); kbps = 0; feedNote = "";
        lastSttTs = 0;  // fresh panel -> accept the history replay
        connectFeed();
        connectTranscripts();
        rafId = requestAnimationFrame(drawFeed);
      } else {
        if (audioWs) audioWs.close();
        if (sttWs) sttWs.close();
        if (rafId) cancelAnimationFrame(rafId);
        audioWs = null; sttWs = null; rafId = null;
        transcriptsEl.innerHTML = "";
      }
    }
    micBtn.addEventListener("click", toggleFeed);

    sendEl.addEventListener("click", () => (streaming ? stop() : send()));
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!streaming) send(); }
      else if (e.key === "Escape" && streaming) { e.preventDefault(); stop(); }
    });

    function autoGrow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
    }
    inputEl.addEventListener("input", autoGrow);

    loadModels();
    loadNodes();
    loadAgents();
    connect();
  </script>
</body>
</html>
