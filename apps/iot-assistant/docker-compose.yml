# The iot-assistant agent CLI, containerized. It's a one-shot command (not a
# long-running service), so use `run`, not `up`:
#
#   docker compose build
#   docker compose run --rm agent "blink led 1 fast and point the servo at 45"
#
# Per-machine config lives in .env (auto-read by compose). The always-on brain
# for this device is apps/agents; this is the standalone/dev harness.
services:
  agent:
    build:
      context: .
    image: iot_ai-iot-assistant
    extra_hosts:
      # Lets LLM_BASE_URL=http://host.docker.internal:11434 reach an Ollama/
      # HAProxy running on this same host.
      - "host.docker.internal:host-gateway"
    environment:
      # The cluster's single endpoint (HAProxy, native Ollama API); real master
      # injected via .env, this default is a fallback.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      # Must be a tool-calling-capable model served by the cluster.
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      # The ESP32's HTTP API (its LAN IP; mDNS doesn't resolve in-container).
      IOT_DEVICE_URL: ${IOT_DEVICE_URL:-http://iot-assistant.local}
    profiles: ["cli"]   # excluded from `docker compose up all`-style sweeps
