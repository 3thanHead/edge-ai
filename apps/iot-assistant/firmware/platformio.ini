; iot-assistant -- ESP32-S3 firmware (PlatformIO + Arduino).
;
; Demo build: two breadboard LEDs (GPIO 4 red / 5 blue) + the `leds` group,
; the onboard RGB (48), an SG90 servo (16), the ST7789 face, WiFi + the
; agent-facing HTTP API + MQTT.
;
;   make flash          # build + upload over USB  (from apps/iot-assistant/)
;   make monitor        # serial monitor @115200
;   make devices        # list serial ports
;
; WiFi credentials and the MQTT broker (WIFI_SSID / WIFI_PASS / MQTT_HOST)
; are injected at build time from the repo-root .env -- the Makefile loads
; it. For a raw `pio run`:
;   set -a; source ../../../.env; set +a
;
; Board: ESP32-S3-WROOM-1 dev board on a passive GPIO extension board.
; Flash/console over the S3's native USB (/dev/ttyACM*): usbip drops the
; auto-reset, so enter download mode by hand (hold BOOT, tap RESET) before
; uploading. Serial is routed to native USB CDC (CDC_ON_BOOT=1).

[platformio]
default_envs = esp32s3-devkit
src_dir = src

[env:esp32s3-devkit]
platform = espressif32 @ ^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    knolleary/PubSubClient@^2.8
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"0.3.0\"
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DMQTT_HOST="${sysenv.MQTT_HOST}"'
    ; -- TFT_eSPI: ST7789 240x320 SPI, pins must match board_config.h --------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=42
    -DTFT_DC=39
    -DTFT_RST=38
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000
    ; On the S3 TFT_eSPI's default port maps to SPI0 (flash) and null-derefs
    ; in init(); route the panel through the HSPI host instead.
    -DUSE_HSPI_PORT=1
