; iot-assistant -- ESP32-S3 firmware (PlatformIO + Arduino).
;
; Demo build: two breadboard LEDs (GPIO 4 red / 5 blue) + the `leds` group,
; the onboard RGB (48), an SG90 servo (16), WiFi + the agent-facing HTTP API
; + MQTT. (The ST7789 LCD face is deferred to Phase 3.)
;
;   make flash          # build + upload over USB  (from apps/iot-assistant/)
;   make monitor        # serial monitor @115200
;   make devices        # list serial ports
;
; WiFi credentials and the MQTT broker (WIFI_SSID / WIFI_PASS / MQTT_HOST)
; are injected at build time from the repo-root .env -- the Makefile loads
; it. For a raw `pio run`:
;   set -a; source ../../../.env; set +a
;
; Board: ESP32-S3-WROOM-1 dev board on a passive GPIO extension board.
; Flash/console over the S3's native USB (/dev/ttyACM*): usbip drops the
; auto-reset, so enter download mode by hand (hold BOOT, tap RESET) before
; uploading. Serial is routed to native USB CDC (CDC_ON_BOOT=1).

[platformio]
default_envs = esp32s3-devkit
src_dir = src

[env:esp32s3-devkit]
platform = espressif32 @ ^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    knolleary/PubSubClient@^2.8
build_flags =
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"0.3.0\"
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DMQTT_HOST="${sysenv.MQTT_HOST}"'
