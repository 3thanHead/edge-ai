; iot-assistant -- ESP32-S3 firmware (PlatformIO + Arduino).
;
; Wired set (see include/board_config.h for the pin map): three status LEDs
; (green 21 / yellow 47 / red 48) + the `leds` group, the 2.0" ST7789 SPI
; face, two 0.96" I2C displays (one per hardware I2C bus), the LAFVIN audio
; codec module (I2S + bit-banged control I2C + PA_EN), WiFi + the
; agent-facing HTTP API + MQTT.
;
;   make flash          # build + upload over USB  (from apps/iot-assistant/)
;   make monitor        # serial monitor @115200
;   make devices        # list serial ports
;
; WiFi credentials and the MQTT broker (WIFI_SSID / WIFI_PASS / MQTT_HOST)
; are injected at build time from the repo-root .env -- the Makefile loads
; it. For a raw `pio run`:
;   set -a; source ../../../.env; set +a
;
; Board: ESP32-S3-WROOM-1 dev board on a passive GPIO extension board.
; Flash/console over the S3's native USB (/dev/ttyACM*): usbip drops the
; auto-reset, so enter download mode by hand (hold BOOT, tap RESET) before
; uploading. Serial is routed to native USB CDC (CDC_ON_BOOT=1).

[platformio]
default_envs = esp32s3-devkit
src_dir = src

[env:esp32s3-devkit]
platform = espressif32 @ ^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1
build_flags =
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"0.6.2\"
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DMQTT_HOST="${sysenv.MQTT_HOST}"'
